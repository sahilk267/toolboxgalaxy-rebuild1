name: Advanced Core Tools Browser QA
on:
  pull_request:
    branches: [feat/advanced-qr-generator]
    paths:
      - .github/workflows/advanced-core-browser.yml
      - client/src/components/AdvancedFaviconTool.tsx
      - client/src/components/AdvancedPasswordTools.tsx
      - client/src/components/AdvancedJsonStation.tsx
      - client/src/lib/faviconPackage.ts
      - client/src/lib/passwordWorkbench.ts
      - client/src/lib/jsonWorkspaceEngine.ts
      - client/src/pages/ToolWorkspace.tsx
      - scripts/verify-advanced-core-tools.ts
      - scripts/verify-advanced-core-browser.mjs
      - package.json
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build actual production bundle
        run: npm run build
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx --no-install playwright install chromium
      - name: Verify downloads and UI on Chromium
        run: |
          nohup npm run start > /tmp/tbg-advanced-core.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          node scripts/verify-advanced-core-browser.mjs
          node scripts/verify-advanced-qr-browser.mjs
          node scripts/verify-advanced-everyday-browser.mjs
      - name: Server log after failure
        if: failure()
        run: tail -n 100 /tmp/tbg-advanced-core.log || true

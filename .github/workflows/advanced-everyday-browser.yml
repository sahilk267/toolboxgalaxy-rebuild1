name: Advanced Everyday Browser QA
on:
  pull_request:
    branches: [feat/browser-ai-background-remover]
    paths:
      - .github/workflows/advanced-everyday-browser.yml
      - client/src/components/AdvancedEverydayTools.tsx
      - client/src/lib/advancedEverydayEngines.ts
      - client/src/pages/ToolWorkspace.tsx
      - scripts/verify-advanced-everyday-browser.mjs
      - scripts/verify-advanced-everyday.ts
      - package.json
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build actual production bundle
        run: npm run build
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx --no-install playwright install chromium
      - name: Browser UI and downloaded-report smoke
        run: |
          nohup npm run start > /tmp/tbg-everyday.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          node scripts/verify-advanced-everyday-browser.mjs
      - name: Server log on failure
        if: failure()
        run: tail -n 100 /tmp/tbg-everyday.log || true

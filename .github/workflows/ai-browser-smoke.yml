name: Browser AI smoke
on:
  pull_request:
    branches: [main]
    paths:
      - client/src/components/BackgroundRemoverTool.tsx
      - client/src/workers/backgroundRemoval.worker.ts
      - client/src/lib/backgroundRemovalValidation.ts
      - scripts/verify-background-browser.mjs
      - scripts/prepare-background-model.ts
      - package.json
      - package-lock.json
      - .github/workflows/ai-browser-smoke.yml
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx --no-install playwright install chromium
      - name: Run actual browser inference and download smoke
        run: |
          nohup npm run start > /tmp/toolbox-ai-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          node scripts/verify-background-browser.mjs
      - name: Show server output on failure
        if: failure()
        run: tail -n 100 /tmp/toolbox-ai-server.log || true

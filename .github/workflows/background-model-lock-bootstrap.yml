# Temporary branch-scoped workflow: update the npm lockfile for the new AI runtime.
# Remove this file before merging to main.
name: Background model dependency lock bootstrap
on:
  push:
    branches:
      - feat/ai-background-remover
permissions:
  contents: write
jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate consistent dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile if needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(background-removal): synchronize npm lockfile"
            git push origin HEAD:feat/ai-background-remover
          else
            echo "Lockfile already synchronized"
          fi

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/browser-ai-background-remover, feat/advanced-qr-generator ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run build

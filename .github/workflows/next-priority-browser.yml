name: Next Priority Tools Browser QA
on:
  pull_request:
    branches: [feat/browser-ai-background-remover]
    paths:
      - .github/workflows/next-priority-browser.yml
      - client/src/components/AdvancedDailyBatch.tsx
      - client/src/components/AdvancedCreativeBatch.tsx
      - client/src/components/AdvancedDeveloperBatch.tsx
      - client/src/lib/advancedDailyBatch.ts
      - client/src/lib/advancedCreativeBatch.ts
      - client/src/lib/advancedDeveloperBatch.ts
      - client/src/pages/ToolWorkspace.tsx
      - scripts/verify-next-priority-tools.ts
      - scripts/verify-next-priority-browser.mjs
      - package.json
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Production bundle
        run: npm run build
      - name: Isolated Chromium runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx --no-install playwright install --with-deps chromium
      - name: Ten-tool browser regression
        run: |
          nohup npm run start > /tmp/tbg-next-priority.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          node scripts/verify-next-priority-browser.mjs
      - name: Server output if failed
        if: failure()
        run: tail -n 100 /tmp/tbg-next-priority.log || true
